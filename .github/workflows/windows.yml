name: Windows build

on:
  push:
    branches: [anti]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -DskipTests clean package
      - name: Package Windows app
        shell: pwsh
        run: ./packaging/windows/CherkashLauncher.ps1
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CherkashLauncher-windows
          path: target/windows/**
