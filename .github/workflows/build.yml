name: Build Cherkash Launcher
on:
  push:
    branches: [anti]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Package
        run: mvn -B -DskipTests javafx:jlink
